<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FaceGlow Store</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- HEADER -->
    <header>

        <div class="contenedor-header">

            <h1>FaceGlow Store</h1>

            <nav>
                <ul class="menu">
                    <li><a href="index.html">Inicio</a></li>
                </ul>
            </nav>

        </div>

    </header>

    <!-- PRESENTACIÓN -->
    <section class="presentacion">

        <h2>Bienvenidos</h2>

        <p>
            Somos una tienda dedicada al bienestar y cuidado de las personas mediante nuestros productos.
        </p>

    </section>

    <!-- SLOGAN -->
    <section class="slogan">

        <h2>Nuestro slogan</h2>

        <p>Si tu piel brilla, tu vida brilla.</p>

    </section>

    <!-- BUSCADOR -->
    <section class="busqueda">

        <input type="text" id="buscarProductos" placeholder="Buscar productos...">

    </section>

    <!-- MENSAJE COMPRA -->
    <div id="mensaje-compra" class="mensaje-compra"></div>

    <!-- PRODUCTOS -->
    <main>

        <section id="contenedor-productos" class="productos"></section>

    </main>

    <!-- FOOTER -->
    <footer>

        <p>© 2026 FaceGlow Store | Todos los derechos reservados.</p>

        <p>Cañas, Guanacaste, Costa Rica</p>

    </footer>

    <!-- JS -->
    <script src="script.js"></script>

</body>

</html>
